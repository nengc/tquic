name: Rust

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest
    env:
      TARGET: "x86_64-pc-windows-msvc"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Update rust
      run: rustup update
      
