    #     chmod u+x start_tquic.sh
    # - name: Upload tquic_server
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: tquic_server_bin
    #     path: |
    #       tquic_server
    #       start_tquic.sh
    # - name: Upload tquic_client
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: tquic_client_bin
    #     path: tquic_client
      

    - name: Install rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: ${{ env.TARGET }}
    - name: Install dependencies
      uses: crazy-max/ghaction-chocolatey@v3
      with:
        args: install nasm
    - name: Build TQUIC library and tools
      run: cargo build --all -F ffi --verbose

    - name: Upload tquic_server
      uses: actions/upload-artifact@v4
      with:
        name: tquic_server_bin
        path: |
          tquic_server.exe
    - name: Upload tquic_client
      uses: actions/upload-artifact@v4
      with:
        name: tquic_client_bin
        path: tquic_client.exe
